spring.application.name=swiftdrop
server.port=8080

# Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/swiftdrop_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=springstudent
spring.datasource.password=springstudent

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Settings
app.jwt.secret=swiftdrop-secret-key-please-change-me-in-production-0123456789
app.jwt.expiration=86400000
